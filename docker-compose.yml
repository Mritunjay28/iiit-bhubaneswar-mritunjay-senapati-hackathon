services:
  postgres:
    image: postgres:16-alpine
    container_name: riskengine-postgres
    restart: always
    environment:
      POSTGRES_DB: riskengine
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d riskengine"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - risk-network

  nlp-service:
    build:
      context: ./src/nlp-service
      dockerfile: Dockerfile
    container_name: riskengine-nlp
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    environment:
      - MODEL_NAME=ProsusAI/finbert
      - DATA_DIR=/app/data
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - risk-network

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: riskengine-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      nlp-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/riskengine
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      NLP_SERVICE_URL: http://nlp-service:8000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - risk-network

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: riskengine-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - risk-network

volumes:
  pgdata:
    driver: local

networks:
  risk-network:
    driver: bridge
