version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: riskengine-postgres
    restart: always
    environment:
      POSTGRES_DB: riskengine
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d riskengine"]
      interval: 5s
      timeout: 5s
      retries: 5

  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: riskengine-nlp
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - MODEL_NAME=ProsusAI/finbert
      - DATA_DIR=/app/data
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          memory: 4G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: riskengine-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nlp-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/riskengine
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      NLP_SERVICE_URL: http://nlp-service:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: riskengine-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
