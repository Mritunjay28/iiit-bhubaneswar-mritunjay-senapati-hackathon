# Server Configuration
server.port=8080

# Spring Application
spring.application.name=risk-engine-backend

# Datasource Configuration (PostgreSQL default, overridable by environment variable)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/riskengine}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Custom Risk Engine Settings
riskengine.nlp.base-url=${NLP_SERVICE_URL:http://localhost:8000}
riskengine.nlp.timeout-ms=30000
riskengine.stress-test.high-impact-threshold=7
