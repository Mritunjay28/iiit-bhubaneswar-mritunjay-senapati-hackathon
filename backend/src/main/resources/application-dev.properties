# ==============================================================================
# Local Development Profile (H2 In-Memory Database)
# Zero external configuration required: boots instantly with pre-seeded data
# ==============================================================================

server.port=8080
spring.application.name=risk-engine-backend

# In-Memory H2 Database with PostgreSQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:riskengine;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Custom Risk Engine Settings
riskengine.nlp.base-url=${NLP_SERVICE_URL:http://localhost:8000}
riskengine.nlp.timeout-ms=3000
riskengine.stress-test.high-impact-threshold=7
