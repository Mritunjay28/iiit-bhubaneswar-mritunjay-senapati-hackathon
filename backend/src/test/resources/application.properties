# In-Memory H2 for Fast, Isolated Unit and Integration Testing
spring.datasource.url=jdbc:h2:mem:riskengine_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Risk Engine Test Config
riskengine.nlp.base-url=http://localhost:8000
riskengine.nlp.timeout-ms=2000
riskengine.stress-test.high-impact-threshold=7
